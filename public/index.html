<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Wekker API</title>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <h1 id="clock">--:--:--</h1>
        </header>

        <section class="card">
            <p id="next-alarm">Wekker wordt geladen...</p>
            <p id="countdown" class="countdown"></p>
        </section>

        <p id="error" class="error"></p>

        <section class="card">
            <h2>Wekkers</h2>
            <ul id="alarm-list" class="alarm-list"></ul>
        </section>

        <section class="card">
            <h2>Nieuwe wekker</h2>
            <form id="alarm-form" class="alarm-form">
                <input type="text" id="name" placeholder="Naam">
                <input type="number" id="hour" min="0" max="23" placeholder="Uur">
                <input type="number" id="minute" min="0" max="59" placeholder="Minuut">

                <div id="days" class="days">
                    <label><input type="checkbox" value="maandag"> ma</label>
                    <label><input type="checkbox" value="dinsdag"> di</label>
                    <label><input type="checkbox" value="woensdag"> wo</label>
                    <label><input type="checkbox" value="donderdag"> do</label>
                    <label><input type="checkbox" value="vrijdag"> vr</label>
                    <label><input type="checkbox" value="zaterdag"> za</label>
                    <label><input type="checkbox" value="zondag"> zo</label>
                </div>

                <label class="checkbox-row"><input type="checkbox" id="enabled" checked> Actief</label>
                <button type="submit">Toevoegen</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
